name: weather_app
description: "A new Flutter project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Location
  geolocator: ^14.0.3
  geocoding: ^4.0.0
  permission_handler: ^12.0.3

  # UI
  lottie: ^3.4.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0

  # State management
  flutter_riverpod: ^2.6.1

  # Network
  dio: ^5.10.0
  retrofit: ^4.9.2

  # Navigation
  go_router: ^17.3.0

  # Storage
  hive: ^2.2.3
  shared_preferences: ^2.5.3

  # Serialization (runtime annotations — must be in dependencies)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  timezone: ^0.11.1

  # Tooling (optional at runtime, kept here for launcher icons plugin)
  flutter_launcher_icons: ^0.14.4
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.15.0
  freezed: ^3.1.0
  json_serializable: ^6.14.0
  retrofit_generator: ^10.2.7

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/animations/
    - assets/images/