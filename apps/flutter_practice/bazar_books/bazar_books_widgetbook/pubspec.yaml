name: bazar_books_widgetbook
description: Bazar Books Widgetbook Mobile

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  clipboard: ^0.1.3


  http: ^1.2.2

  # A Flutter package that helps developers catalog their widgets, test them quickly on multiple devices
  widgetbook: 3.3.0
  
  widgetbook_annotation: 3.0.0
  
  get_it: ^7.7.0

  # Customize Flutter's default white native splash screen with background color and splash image. Supports dark mode, full screen, and more.
  flutter_bloc: ^8.1.6

dev_dependencies:
  build_runner: ^2.4.11
  flutter_test:
    sdk: flutter


  # A package to automate setup and maintenance of the widgetbook package by using code generation.
  widgetbook_generator: any


  # A recommended set of lints for Flutter apps, packages, and plugins to encourage good coding practices
  flutter_lints: ^2.0.0

  # Analysis
  very_good_analysis: 2.4.0

  # Create fake data for testing
  faker: ^2.2.0

  modal_bottom_sheet: 3.0.0-pre

  # UI design for banking app
  bazar_books_design:
    path: ../bazar_books_design

  # Banking consumer
  bazar_books_app:
    path: ../bazar_books_app

  # A declarative router for Flutter based on Navigation 2 supporting deep linking, data-driven routes and more
  go_router: 14.1.4

  # nternationalized/localized messages
  intl: ^0.20.0




  flutter_localizations:
    sdk: flutter

  # All widget books stuffs
  # Issue: widgetbook >=2.0.6-beta working go_router ^3.0.5 but our app depends on go_router 4.4.1(have some change about routeInformationProvider) so it should to custom repo to fix it.

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - assets/

dependency_overrides:
  intl: 0.20.2
