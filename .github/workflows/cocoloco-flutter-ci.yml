name: Cocoloco Flutter CI/CD

on:
  push:
    branches:
      - main
      - training-flutter-advance
      - 'feature/**'
  pull_request:
    branches:
      - main
      - training-flutter-advance
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze_and_test:
    name: Lint & Test Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_practice/cocoloco_app

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis (0 Issues Gate)
        run: flutter analyze

      - name: 🧪 Execute Unit & Widget Tests (197 Tests)
        run: flutter test --coverage
